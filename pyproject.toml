[project]
name = "protocolo"
version = "0.1.0"
description = "A serial communication protocol library with packet encoding/decoding, CRC validation, and file transfer capabilities"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "rafa-rrayes"}
]
keywords = ["serial", "communication", "protocol", "crc", "packet", "file-transfer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[project.urls]
Homepage = "https://github.com/rafa-rrayes/Protocolo"
Repository = "https://github.com/rafa-rrayes/Protocolo"
Issues = "https://github.com/rafa-rrayes/Protocolo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["protocolo"]

